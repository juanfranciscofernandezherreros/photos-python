services:
  app:
    environment:
      COOKIE_SECURE: "true"

  caddy:
    image: caddy:2-alpine
    container_name: photos_caddy
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      PHOTOS_DOMAIN: ${PHOTOS_DOMAIN:-photos.example.com}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

volumes:
  caddy_data:
  caddy_config:
