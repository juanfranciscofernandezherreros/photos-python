[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "photos-sync"
version = "0.1.0"
description = "Extract, organize by date, and compress screenshots from an Android phone mounted via WebDAV"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "rich>=13.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.0",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "requests>=2.31",
    "bcrypt>=4.0",
    "itsdangerous>=2.0",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
ssh = [
    "paramiko>=3.4",
]
images = [
    "Pillow>=10.0",
    "geopy>=2.4",
]
dev = [
    "mypy>=1.9",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-bdd>=7.0",
    "pytest-html>=4.0",
    "httpx>=0.27",
    "ruff>=0.4",
    "paramiko>=3.4",
    "Pillow>=10.0",
    "sqlalchemy>=2.0",
]

[project.scripts]
photos-sync         = "photos_sync.cli:main"
photos-sync-web     = "photos_sync.__main__:main"

[tool.setuptools.packages.find]
include = ["photos_sync*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = [
    "E402",   # module-level import not at top (contextual imports in web_server)
    "E501",   # line too long — handled by formatter
    "E702",   # multiple statements on one line (semicolons in compact test code)
    "E741",   # ambiguous variable name
    "F401",   # imported but unused (facades + re-exports)
    "F403",   # star imports in facade modules
    "F811",   # redefinition of unused name (endpoint duplication)
    "UP007",  # Optional[X] → X | None (too noisy for now)
    "UP035",  # deprecated import (typing.Iterator → collections.abc)
    "UP037",  # quoted type annotations
    "UP045",  # Optional[X] → X | None
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_return_any = false
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
