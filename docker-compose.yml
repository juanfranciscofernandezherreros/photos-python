services:

  db:
    image: postgres:16-alpine
    container_name: photos_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       photos_sync
      POSTGRES_USER:     photos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-photos2024}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U photos -d photos_sync"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: photos_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://photos:${POSTGRES_PASSWORD:-photos2024}@db:5432/photos_sync
      SECRET_KEY: ${SECRET_KEY:-change-me-in-env-file}
      METRICS_ENABLED: "true"
      METRICS_ADDR: 0.0.0.0
      METRICS_PORT: 9000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SERVICE_NAME: ${SERVICE_NAME:-mi-api}
    volumes:
      - ${PHOTOS_DIR:-./photos}:/data
    ports:
      - "${APP_PORT:-8765}:8765"
    expose:
      - "9000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8765/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Automatic backup ─────────────────────────────────────────────────────
  # Runs pg_dump every 24 h and keeps the last BACKUP_KEEP_DAYS days of
  # dumps. Backups land in ./backups/ on the host (or BACKUP_DIR in .env).
  # To restore: see the "Restore a backup" section in README.
  backup:
    image: postgres:16-alpine
    container_name: photos_backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST:     db
      PGPORT:     5432
      PGDATABASE: photos_sync
      PGUSER:     photos
      PGPASSWORD: ${POSTGRES_PASSWORD:-photos2024}
      # How many daily dumps to keep (older ones are deleted automatically)
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
    # Infinite loop: dump → sleep 24 h → repeat.
    # The entrypoint script:
    #   1. Creates /backups if it doesn't exist.
    #   2. Dumps the DB with a timestamp filename.
    #   3. Deletes dumps older than BACKUP_KEEP_DAYS days.
    #   4. Sleeps 24 h.
    entrypoint: >
      sh -c "
        mkdir -p /backups &&
        while true; do
          FILE=/backups/photos_sync_$$(date +%Y%m%d_%H%M%S).sql.gz &&
          echo \"[backup] Starting dump → $$FILE\" &&
          pg_dump --no-password | gzip > $$FILE &&
          echo \"[backup] Done (size: $$(du -sh $$FILE | cut -f1))\" &&
          find /backups -name '*.sql.gz' -mtime +$${BACKUP_KEEP_DAYS} -delete &&
          echo \"[backup] Cleaned up dumps older than $${BACKUP_KEEP_DAYS} days\" &&
          echo \"[backup] Next backup in 24 h\" &&
          sleep 86400;
        done
      "

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: photos_pgadmin
    restart: unless-stopped
    profiles: ["admin"]
    environment:
      PGADMIN_DEFAULT_EMAIL:    ${PGADMIN_EMAIL:-admin@photos.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy

  # ── Observability (docker compose --profile monitoring up -d) ────────────
  prometheus:
    image: prom/prometheus:v3.12.0
    container_name: photos_prometheus
    restart: unless-stopped
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-2GB}
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      app:
        condition: service_healthy
      cadvisor:
        condition: service_started
      postgres-exporter:
        condition: service_started

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.19.1
    container_name: photos_postgres_exporter
    restart: unless-stopped
    profiles: ["monitoring"]
    environment:
      DATA_SOURCE_NAME: postgresql://photos:${POSTGRES_PASSWORD:-photos2024}@db:5432/photos_sync?sslmode=disable
    expose:
      - "9187"
    depends_on:
      db:
        condition: service_healthy

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.57.0
    container_name: photos_cadvisor
    restart: unless-stopped
    profiles: ["monitoring"]
    privileged: true
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    expose:
      - "8080"

  loki:
    image: grafana/loki:3.7.2
    container_name: photos_loki
    restart: unless-stopped
    profiles: ["monitoring"]
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./monitoring/loki/loki.yml:/etc/loki/loki.yml:ro
      - ./monitoring/loki/rules:/etc/loki/rules:ro
      - loki_data:/loki
    expose:
      - "3100"

  alloy:
    image: grafana/alloy:v1.18.0
    container_name: photos_alloy
    restart: unless-stopped
    profiles: ["monitoring"]
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy
      - /etc/alloy/config.alloy
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy
    expose:
      - "12345"
    depends_on:
      loki:
        condition: service_started

  grafana:
    image: grafana/grafana:11.6.0
    container_name: photos_grafana
    restart: unless-stopped
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-this-grafana-password}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_METRICS_ENABLED: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/api-rest-observability.json
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 1s
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started

volumes:
  postgres_data:
  pgadmin_data:
  prometheus_data:
  grafana_data:
  loki_data:
  alloy_data:
