groups:
  - name: photos-sync-availability
    rules:
      - alert: PhotosSyncApplicationDown
        expr: up{job="photos-sync"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Photos Sync no expone métricas"
          description: "Prometheus no puede acceder a app:9000 desde hace 2 minutos."

      - alert: PhotosSyncHighErrorRate
        expr: |
          sum(rate(photos_http_requests_total{status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(photos_http_requests_total[5m])), 0.001) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Más de un 5% de respuestas 5xx"
          description: "La tasa global de errores lleva 5 minutos por encima del 5%."

      - alert: PhotosSyncSlowRequests
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(photos_http_request_duration_seconds_bucket[5m]))
          ) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Latencia p95 superior a 2 segundos"
          description: "El percentil 95 global permanece por encima de 2 s."

      - alert: PhotosSyncPipelineFailed
        expr: increase(photos_pipeline_runs_total{status="error"}[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Ha fallado una ejecución del pipeline"
          description: "Revisa los eventos pipeline_finished en Loki."

      - alert: PhotosSyncWebDAVFailed
        expr: increase(photos_webdav_jobs_total{status="error"}[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Ha fallado una descarga WebDAV"
          description: "Revisa los eventos webdav_job_finished en Loki."

  - name: photos-sync-resources
    rules:
      - alert: PhotosSyncHighProcessMemory
        expr: process_resident_memory_bytes{job="photos-sync"} > 1073741824
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "La aplicación supera 1 GiB de RAM"

      - alert: PhotosSyncHighProcessCPU
        expr: rate(process_cpu_seconds_total{job="photos-sync"}[5m]) > 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "La aplicación consume más del 80% de un núcleo"

      - alert: PhotosSyncContainerMemoryHigh
        expr: |
          container_memory_working_set_bytes{
            container_label_com_docker_compose_service="app",
            image!=""
          } > 1610612736
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "El contenedor de la aplicación supera 1.5 GiB de RAM"

  - name: photos-sync-database
    rules:
      - alert: PhotosSyncPostgresExporterDown
        expr: up{job="postgres"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "No se pueden recopilar métricas de PostgreSQL"

      - alert: PhotosSyncPostgresConnectionsHigh
        expr: pg_stat_database_numbackends{datname="photos_sync"} > 80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL tiene más de 80 conexiones activas"
