name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  # ── Lint + type-check + test ───────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check photos_sync/ tests/

      - name: Type-check with mypy
        run: mypy photos_sync/ --ignore-missing-imports

      - name: Run tests
        run: pytest tests/ -q --tb=short

  # ── Build wheel + sdist and smoke-test the CLI entry points ───────
  build:
    runs-on: ubuntu-latest
    needs: test          # only build if tests pass on all matrix legs

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tool
        run: pip install --upgrade build

      - name: Build wheel and sdist
        run: python -m build

      - name: List dist artefacts
        run: ls -lh dist/

      - name: Install the built wheel into a fresh venv
        run: |
          python -m venv .venv-build
          .venv-build/bin/pip install --upgrade pip
          .venv-build/bin/pip install "$(ls dist/*.whl)[ssh,images]"

      - name: Smoke-test CLI entry points
        run: |
          .venv-build/bin/photos-sync --help
          .venv-build/bin/photos-sync-web --help

      - name: Upload build artefacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 14
