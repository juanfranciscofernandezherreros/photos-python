name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: Static analysis (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ruff
            command: python -m ruff check photos_sync tests
          - name: mypy
            command: python -m mypy photos_sync --ignore-missing-imports

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and quality tools
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and test tools
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests -q --tb=short

  build:
    name: Build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [static-analysis, test]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tool
        run: python -m pip install --disable-pip-version-check build

      - name: Build wheel and source distribution
        run: python -m build

      - name: Install wheel in a clean environment
        run: |
          python -m venv .venv-build
          .venv-build/bin/python -m pip install --disable-pip-version-check --upgrade pip
          .venv-build/bin/python -m pip install "$(find dist -maxdepth 1 -name '*.whl' -print -quit)[ssh,images]"

      - name: Smoke-test CLI entry points
        run: |
          .venv-build/bin/photos-sync --help
          .venv-build/bin/photos-sync-web --help

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 14

  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    if: always()
    needs: [static-analysis, test, build]
    steps:
      - name: Require every CI stage to pass
        env:
          STATIC_RESULT: ${{ needs.static-analysis.result }}
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          test "$STATIC_RESULT" = success
          test "$TEST_RESULT" = success
          test "$BUILD_RESULT" = success
